# env.conf -- the ONLY file you normally need to edit.
# Everything for one course/project lives under SHARE_DIR.

# Short name: letters, digits, . _ -  (used for the kernelspec directory)
KERNEL_NAME="climate588-2025"

# What students see in the Jupyter kernel picker
DISPLAY_NAME="climate588 (2025)"

# Absolute path on Turbo. A dedicated, empty-or-previously-managed directory:
# setup creates env/, kernels/, .pkgs/ and join.sh inside it.
SHARE_DIR="/nfs/turbo/mmiranda2/jsonk/climate588-2025"

# Conda environment file (relative to this file, or absolute)
ENV_YML="environment.yml"

# Optional: Unix group that should be able to READ the env (e.g. your Turbo
# group). Leave blank to keep whatever group the directory already has.
SHARE_GROUP=""

# Module that provides mamba/conda. Module names change between cluster
# software refreshes, so if setup says it can't load it, run:
#     module spider mamba
# and put the right name here. Use "" if mamba/conda is already on your PATH.
MAMBA_MODULE="mamba"

